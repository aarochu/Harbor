<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1290" viewBox="0 0 900 1290" font-family="Inter, 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Harbor — autonomous deployment agent architecture</title>
  <desc>A repository URL enters at the top. Harbor profiles it, deploys it, observes the result, and on failure diagnoses, repairs and redeploys until the service is healthy or it escalates to a human.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b6bcc7"/>
    </marker>
  </defs>

  <rect width="900" height="1290" fill="#ffffff"/>

  <!-- legend -->
  <rect x="150" y="24" width="600" height="46" rx="8" fill="#fcfcfd" stroke="#e8eaee"/>

  <rect x="176" y="38" width="66" height="20" rx="5" fill="#e9e6fb" stroke="#b8b0ee"/>
  <text x="209" y="52" text-anchor="middle" font-size="10.5" fill="#3730a3">I / O</text>

  <rect x="256" y="38" width="104" height="20" rx="5" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="308" y="52" text-anchor="middle" font-size="10.5" fill="#14532d">Deterministic</text>

  <rect x="374" y="38" width="86" height="20" rx="5" fill="#fdf0d5" stroke="#edc27a"/>
  <text x="417" y="52" text-anchor="middle" font-size="10.5" fill="#78350f">Guardrail</text>

  <rect x="474" y="38" width="80" height="20" rx="5" fill="#fdeaea" stroke="#f0b4b4"/>
  <text x="514" y="52" text-anchor="middle" font-size="10.5" fill="#7f1d1d">Model</text>

  <rect x="568" y="38" width="156" height="20" rx="5" fill="#ffffff" stroke="#d8dce3"/>
  <text x="646" y="52" text-anchor="middle" font-size="10.5" fill="#6b7280">feedback / observe</text>

  <!-- 1 input -->
  <rect x="300" y="96" width="300" height="54" rx="8" fill="#e9e6fb" stroke="#b8b0ee"/>
  <text x="450" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Repository URL</text>
  <text x="450" y="136" text-anchor="middle" font-size="10" fill="#6b7280">One GitHub link. No build command, no config, no hints.</text>
  <path d="M450 150 L450 176" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2 clone -->
  <rect x="300" y="178" width="300" height="54" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="450" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Clone into an isolated workdir</text>
  <text x="450" y="218" text-anchor="middle" font-size="10" fill="#6b7280">https + github.com only · argv, never a shell · reads scoped to the clone</text>
  <path d="M450 232 L450 258" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 3 profile -->
  <rect x="300" y="260" width="300" height="60" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="450" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Repository profile</text>
  <text x="450" y="299" text-anchor="middle" font-size="10" fill="#6b7280">Framework · port binding · database · env vars · manifests</text>
  <text x="450" y="313" text-anchor="middle" font-size="10" fill="#6b7280">Every finding cites a file and a line</text>

  <path d="M450 320 L450 344 L255 344 L255 366" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M450 320 L450 344 L645 344 L645 366" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4a plan -->
  <rect x="110" y="368" width="290" height="54" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="255" y="390" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Deployment plan</text>
  <text x="255" y="408" text-anchor="middle" font-size="10" fill="#6b7280">Build and start command from the manifest that ships</text>

  <!-- 4b approval -->
  <rect x="500" y="368" width="290" height="54" rx="8" fill="#fdf0d5" stroke="#edc27a"/>
  <text x="645" y="390" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Approval gate</text>
  <text x="645" y="408" text-anchor="middle" font-size="10" fill="#6b7280">Paid resources need consent. Silence is refusal.</text>

  <path d="M255 422 L255 448 L450 448 L450 470" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M645 422 L645 448 L450 448" fill="none" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- 5 create -->
  <rect x="300" y="472" width="300" height="54" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="450" y="494" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Create service and configure</text>
  <text x="450" y="512" text-anchor="middle" font-size="10" fill="#6b7280">Idempotent by name · env vars write-only, never read back</text>
  <path d="M450 526 L450 552" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 6 deploy -->
  <rect x="300" y="554" width="300" height="54" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="450" y="576" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Deploy and poll to terminal</text>
  <text x="450" y="594" text-anchor="middle" font-size="10" fill="#6b7280">Succeeded · failed · timed out — a slow build is not a broken one</text>
  <path d="M450 608 L450 634" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 7 health -->
  <rect x="300" y="636" width="300" height="54" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="450" y="658" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Health probe</text>
  <text x="450" y="676" text-anchor="middle" font-size="10" fill="#6b7280">Cold-start tolerant · answered is not healthy · silence is not a wrong path</text>

  <path d="M600 663 L836 663 L836 1109 L604 1109" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="830" y="655" text-anchor="end" font-size="9.5" fill="#6b7280">healthy</text>

  <path d="M450 690 L450 704 L255 704 L255 716" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M450 690 L450 704 L645 704 L645 716" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="462" y="700" font-size="9.5" fill="#6b7280">not healthy</text>

  <!-- 8 diagnose -->
  <rect x="110" y="718" width="290" height="60" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="255" y="740" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Diagnose</text>
  <text x="255" y="757" text-anchor="middle" font-size="10" fill="#6b7280">Build log + app log + profile to a failure class</text>
  <text x="255" y="771" text-anchor="middle" font-size="10" fill="#6b7280">Confidence and cited evidence, or "unknown"</text>

  <!-- 8b budget -->
  <rect x="500" y="718" width="290" height="60" rx="8" fill="#fdf0d5" stroke="#edc27a"/>
  <text x="645" y="740" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Run budget</text>
  <text x="645" y="757" text-anchor="middle" font-size="10" fill="#6b7280">Turn cap · wall clock · fix limit · cost ceiling</text>
  <text x="645" y="771" text-anchor="middle" font-size="10" fill="#6b7280">Throws rather than returning false</text>

  <path d="M255 778 L255 800 L450 800 L450 822" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M645 778 L645 800 L450 800" fill="none" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- 9 advisor -->
  <rect x="300" y="824" width="300" height="60" rx="8" fill="#fdeaea" stroke="#f0b4b4"/>
  <text x="450" y="846" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Advisor — apply or escalate</text>
  <text x="450" y="863" text-anchor="middle" font-size="10" fill="#6b7280">The one place judgement is exercised, and the only model call</text>
  <text x="450" y="877" text-anchor="middle" font-size="10" fill="#6b7280">May be more cautious than the rules, never less</text>

  <path d="M300 854 L64 854 L64 1109 L296 1109" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="70" y="846" font-size="9.5" fill="#6b7280">escalate</text>

  <path d="M450 884 L450 910" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="462" y="902" font-size="9.5" fill="#6b7280">apply</text>

  <!-- 10 fix plan -->
  <rect x="300" y="912" width="300" height="54" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="450" y="934" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Plan the fix, produce a diff</text>
  <text x="450" y="952" text-anchor="middle" font-size="10" fill="#6b7280">Declarative change · nothing is written until the diff exists</text>
  <path d="M450 966 L450 992" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 11 commit -->
  <rect x="300" y="994" width="300" height="60" rx="8" fill="#fdf0d5" stroke="#edc27a"/>
  <text x="450" y="1016" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Commit to harbor/fix-&lt;run&gt;</text>
  <text x="450" y="1033" text-anchor="middle" font-size="10" fill="#6b7280">Never the default branch · never force-pushed</text>
  <text x="450" y="1047" text-anchor="middle" font-size="10" fill="#6b7280">Token via environment, never argv or .git/config</text>

  <path d="M300 1024 L214 1024 L214 581 L296 581" fill="none" stroke="#b6bcc7" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="222" y="808" font-size="9.5" fill="#8b93a1">repoint branch,</text>
  <text x="222" y="820" font-size="9.5" fill="#8b93a1">redeploy, re-verify</text>

  <path d="M450 1054 L450 1080" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 12 outcome -->
  <rect x="300" y="1082" width="300" height="54" rx="8" fill="#e9e6fb" stroke="#b8b0ee"/>
  <text x="450" y="1104" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Live URL, or a question for a human</text>
  <text x="450" y="1122" text-anchor="middle" font-size="10" fill="#6b7280">Success requires a passing health check. Never a build alone.</text>

  <!-- observability -->
  <path d="M450 1136 L450 1164" stroke="#b6bcc7" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>

  <rect x="96" y="1166" width="230" height="54" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="211" y="1188" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Event bus</text>
  <text x="211" y="1206" text-anchor="middle" font-size="10" fill="#6b7280">Redaction at the boundary, once</text>

  <rect x="346" y="1166" width="208" height="54" rx="8" fill="#e9e6fb" stroke="#b8b0ee"/>
  <text x="450" y="1188" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Postgres</text>
  <text x="450" y="1206" text-anchor="middle" font-size="10" fill="#6b7280">Runs and events, ordered</text>

  <rect x="574" y="1166" width="230" height="54" rx="8" fill="#e9e6fb" stroke="#b8b0ee"/>
  <text x="689" y="1188" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Mission control</text>
  <text x="689" y="1206" text-anchor="middle" font-size="10" fill="#6b7280">SSE, resumable by seq · observes only</text>

  <path d="M326 1193 L342 1193" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M554 1193 L570 1193" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="450" y="1250" text-anchor="middle" font-size="10" fill="#8b93a1">Every step above emits to the bus. Nothing downstream can steer a run.</text>
  <text x="450" y="1268" text-anchor="middle" font-size="10" fill="#8b93a1">Guardrails are enforced at the call boundary, not requested in the prompt.</text>
</svg>
