<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1380" viewBox="0 0 900 1380" font-family="Inter, 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Harbor — autonomous deployment agent architecture</title>
  <desc>A repository URL enters at the top. Harbor profiles it, deploys it, observes the result, and on failure diagnoses, repairs and redeploys until the service is healthy or it escalates to a human.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b6bcc7"/>
    </marker>
  </defs>

  <rect width="900" height="1380" fill="#ffffff"/>

  <!-- legend -->
  <rect x="150" y="24" width="600" height="46" rx="8" fill="#fcfcfd" stroke="#e8eaee"/>
  <rect x="180" y="38" width="60" height="20" rx="5" fill="#e9e6fb" stroke="#b8b0ee"/>
  <text x="210" y="52" text-anchor="middle" font-size="10.5" fill="#3730a3">I / O</text>
  <rect x="254" y="38" width="98" height="20" rx="5" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="303" y="52" text-anchor="middle" font-size="10.5" fill="#14532d">Deterministic</text>
  <rect x="366" y="38" width="80" height="20" rx="5" fill="#fdf0d5" stroke="#edc27a"/>
  <text x="406" y="52" text-anchor="middle" font-size="10.5" fill="#78350f">Guardrail</text>
  <rect x="460" y="38" width="62" height="20" rx="5" fill="#fdeaea" stroke="#f0b4b4"/>
  <text x="491" y="52" text-anchor="middle" font-size="10.5" fill="#7f1d1d">Model</text>
  <rect x="536" y="38" width="184" height="20" rx="5" fill="#ffffff" stroke="#d8dce3"/>
  <text x="628" y="52" text-anchor="middle" font-size="10.5" fill="#6b7280">dashed: feedback / observe</text>

  <!-- 1 input -->
  <rect x="290" y="96" width="320" height="54" rx="8" fill="#e9e6fb" stroke="#b8b0ee"/>
  <text x="450" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Repository URL</text>
  <text x="450" y="136" text-anchor="middle" font-size="10" fill="#6b7280">One GitHub link. No build command, no config.</text>
  <path d="M450 150 L450 176" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2 clone -->
  <rect x="290" y="178" width="320" height="68" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="450" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Clone into an isolated workdir</text>
  <text x="450" y="218" text-anchor="middle" font-size="10" fill="#6b7280">https and github.com only, argv never a shell</text>
  <text x="450" y="232" text-anchor="middle" font-size="10" fill="#6b7280">Reads are scoped to the clone</text>
  <path d="M450 246 L450 272" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 3 profile -->
  <rect x="290" y="274" width="320" height="68" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="450" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Repository profile</text>
  <text x="450" y="314" text-anchor="middle" font-size="10" fill="#6b7280">Framework, port binding, database, env vars</text>
  <text x="450" y="328" text-anchor="middle" font-size="10" fill="#6b7280">Every finding cites a file and a line</text>

  <path d="M450 342 L450 364 L265 364 L265 384" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M450 364 L635 364 L635 384" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4a plan -->
  <rect x="140" y="386" width="250" height="68" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="265" y="408" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Deployment plan</text>
  <text x="265" y="426" text-anchor="middle" font-size="10" fill="#6b7280">Build and start command from</text>
  <text x="265" y="440" text-anchor="middle" font-size="10" fill="#6b7280">the manifest the repo ships</text>

  <!-- 4b approval -->
  <rect x="510" y="386" width="250" height="68" rx="8" fill="#fdf0d5" stroke="#edc27a"/>
  <text x="635" y="408" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Approval gate</text>
  <text x="635" y="426" text-anchor="middle" font-size="10" fill="#6b7280">Paid resources need consent.</text>
  <text x="635" y="440" text-anchor="middle" font-size="10" fill="#6b7280">Silence is refusal.</text>

  <path d="M265 454 L265 476 L450 476 L450 496" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M635 454 L635 476 L450 476" fill="none" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- 5 create -->
  <rect x="290" y="498" width="320" height="54" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="450" y="520" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Create service and configure</text>
  <text x="450" y="538" text-anchor="middle" font-size="10" fill="#6b7280">Idempotent by name, env vars write-only</text>
  <path d="M450 552 L450 578" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 6 deploy -->
  <rect x="290" y="580" width="320" height="68" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="450" y="602" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Deploy and poll to terminal</text>
  <text x="450" y="620" text-anchor="middle" font-size="10" fill="#6b7280">Succeeded, failed, or timed out</text>
  <text x="450" y="634" text-anchor="middle" font-size="10" fill="#6b7280">A slow build is not a broken one</text>
  <path d="M450 648 L450 674" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 7 health -->
  <rect x="290" y="676" width="320" height="68" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="450" y="698" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Health probe</text>
  <text x="450" y="716" text-anchor="middle" font-size="10" fill="#6b7280">Cold-start tolerant, three outcomes</text>
  <text x="450" y="730" text-anchor="middle" font-size="10" fill="#6b7280">Answered is not the same as healthy</text>

  <path d="M610 710 L812 710 L812 1195 L614 1195" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="806" y="702" text-anchor="end" font-size="9.5" fill="#6b7280">healthy</text>

  <path d="M450 744 L450 762 L265 762 L265 782" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M450 762 L635 762 L635 782" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="460" y="758" font-size="9.5" fill="#6b7280">not healthy</text>

  <!-- 8 diagnose -->
  <rect x="140" y="784" width="250" height="68" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="265" y="806" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Diagnose</text>
  <text x="265" y="824" text-anchor="middle" font-size="10" fill="#6b7280">Build log, app log, profile</text>
  <text x="265" y="838" text-anchor="middle" font-size="10" fill="#6b7280">Class, confidence, evidence</text>

  <!-- 8b budget -->
  <rect x="510" y="784" width="250" height="68" rx="8" fill="#fdf0d5" stroke="#edc27a"/>
  <text x="635" y="806" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Run budget</text>
  <text x="635" y="824" text-anchor="middle" font-size="10" fill="#6b7280">Turns, clock, fix limit, cost</text>
  <text x="635" y="838" text-anchor="middle" font-size="10" fill="#6b7280">Throws, never returns false</text>

  <path d="M265 852 L265 872 L450 872 L450 892" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M635 852 L635 872 L450 872" fill="none" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- 9 advisor -->
  <rect x="290" y="894" width="320" height="68" rx="8" fill="#fdeaea" stroke="#f0b4b4"/>
  <text x="450" y="916" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Advisor: apply or escalate</text>
  <text x="450" y="934" text-anchor="middle" font-size="10" fill="#6b7280">The only place a model is consulted</text>
  <text x="450" y="948" text-anchor="middle" font-size="10" fill="#6b7280">May be more cautious, never less</text>

  <path d="M290 928 L48 928 L48 1195 L286 1195" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="56" y="920" font-size="9.5" fill="#6b7280">escalate</text>

  <path d="M450 962 L450 988" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="460" y="980" font-size="9.5" fill="#6b7280">apply</text>

  <!-- 10 fix plan -->
  <rect x="290" y="990" width="320" height="54" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="450" y="1012" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Plan the fix, produce a diff</text>
  <text x="450" y="1030" text-anchor="middle" font-size="10" fill="#6b7280">Nothing is written until the diff exists</text>
  <path d="M450 1044 L450 1070" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 11 commit -->
  <rect x="290" y="1072" width="320" height="68" rx="8" fill="#fdf0d5" stroke="#edc27a"/>
  <text x="450" y="1094" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Commit to harbor/fix-&lt;run&gt;</text>
  <text x="450" y="1112" text-anchor="middle" font-size="10" fill="#6b7280">Never the default branch, never forced</text>
  <text x="450" y="1126" text-anchor="middle" font-size="10" fill="#6b7280">Token via environment, never argv</text>

  <path d="M290 1106 L100 1106 L100 614 L286 614" fill="none" stroke="#b6bcc7" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="108" y="862" font-size="9.5" fill="#8b93a1">repoint branch,</text>
  <text x="108" y="874" font-size="9.5" fill="#8b93a1">redeploy,</text>
  <text x="108" y="886" font-size="9.5" fill="#8b93a1">re-verify</text>

  <path d="M450 1140 L450 1166" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 12 outcome -->
  <rect x="290" y="1168" width="320" height="54" rx="8" fill="#e9e6fb" stroke="#b8b0ee"/>
  <text x="450" y="1190" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Live URL, or a question for a human</text>
  <text x="450" y="1208" text-anchor="middle" font-size="10" fill="#6b7280">Success needs a passing health check</text>

  <!-- observability -->
  <path d="M450 1222 L450 1250" stroke="#b6bcc7" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>

  <rect x="96" y="1252" width="230" height="54" rx="8" fill="#dcf5ea" stroke="#9fd8bf"/>
  <text x="211" y="1274" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Event bus</text>
  <text x="211" y="1292" text-anchor="middle" font-size="10" fill="#6b7280">Redaction at the boundary, once</text>

  <rect x="346" y="1252" width="208" height="54" rx="8" fill="#e9e6fb" stroke="#b8b0ee"/>
  <text x="450" y="1274" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Postgres</text>
  <text x="450" y="1292" text-anchor="middle" font-size="10" fill="#6b7280">Runs and events, ordered</text>

  <rect x="574" y="1252" width="230" height="54" rx="8" fill="#e9e6fb" stroke="#b8b0ee"/>
  <text x="689" y="1274" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Mission control</text>
  <text x="689" y="1292" text-anchor="middle" font-size="10" fill="#6b7280">SSE, resumable by seq</text>

  <path d="M326 1279 L342 1279" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M554 1279 L570 1279" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="450" y="1336" text-anchor="middle" font-size="10" fill="#8b93a1">Every step emits to the bus. Nothing downstream can steer a run.</text>
  <text x="450" y="1354" text-anchor="middle" font-size="10" fill="#8b93a1">Guardrails are enforced at the call boundary, not requested in the prompt.</text>
</svg>
